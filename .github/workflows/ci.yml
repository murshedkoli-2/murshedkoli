name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/portfolio_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-not-a-production-secret-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
